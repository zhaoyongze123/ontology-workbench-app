# 独立多用户验收入口；原18081公网配置保持原状。
worker_processes 1;
pid "/absolute/private/runtime/multiuser-nginx.pid";
error_log "/absolute/private/runtime/nginx-error.log" warn;
events { worker_connections 128; }
http {
 include /opt/homebrew/etc/nginx/mime.types;
 default_type application/octet-stream;
 # OAuth 入口按 Cloudflare 提供的访客地址限速；本机直连回退到 socket 来源。
 map $http_cf_connecting_ip $ontology_source_rate_key {
  "" $binary_remote_addr;
  default $http_cf_connecting_ip;
 }
 map $uri $ontology_oauth_rate_key {
  default "";
  ~^/api/v1/oidc/app/(authorize|token|revoke)$ $ontology_source_rate_key;
 }
 limit_req_zone $ontology_oauth_rate_key zone=ontology_oauth:10m rate=5r/s;
 log_format safe '$request_method $uri $status';
 access_log "/absolute/private/runtime/nginx-access.log" safe;
 server {
  listen 127.0.0.1:18083;
  server_name 127.0.0.1;
  root "/absolute/path/to/ontology-workbench-app/apps/web/dist-multiuser";
  index index.html;
  client_max_body_size 50m;
  add_header Content-Security-Policy "frame-ancestors 'self' https://app.workbench.aos.work" always;
  location = / { return 302 /ontology-management/; }
  location = /ontology-management { return 302 /ontology-management/; }
  # RFC 8414 对带路径 issuer 的 discovery URI；转到 SAS 在 Servlet context 内实际匹配的路径。
  location = /.well-known/oauth-authorization-server/api/v1 {
   proxy_pass http://127.0.0.1:13002/api/v1/.well-known/oauth-authorization-server;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
   proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/v1/ {
   limit_req zone=ontology_oauth burst=20 nodelay;
   limit_req_status 429;
   proxy_pass http://127.0.0.1:13002;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   # Tunnel 入口会由 Cloudflare 覆盖该头；Java 仅在 socket peer 属于此 Nginx 时解析。
   proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_read_timeout 30s;
  }
  location = /oidc/callback {
   access_log off;
   proxy_pass http://127.0.0.1:13002/api/v1/oidc/callback;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
   proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~* ^/ontology-management/.*\.(js|css|png|jpg|svg|ico|woff2?|ttf)$ {
   rewrite ^/ontology-management/(.*)$ /$1 break;
   try_files $uri =404;
  }
  location /ontology-management/ {
   rewrite ^/ontology-management/(.*)$ /$1 break;
   try_files $uri $uri/ /index.html;
  }
  location = /index.html { internal; }
  location / { return 404; }
 }
}
