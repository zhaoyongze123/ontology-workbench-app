# 独立多用户验收入口；原18081公网配置保持原状。
worker_processes 1;
pid "/absolute/private/runtime/multiuser-nginx.pid";
error_log "/absolute/private/runtime/nginx-error.log" warn;
events { worker_connections 128; }
http {
 include /opt/homebrew/etc/nginx/mime.types;
 default_type application/octet-stream;
 log_format safe '$request_method $uri $status';
 access_log "/absolute/private/runtime/nginx-access.log" safe;
 server {
  listen 127.0.0.1:18083;
  server_name 127.0.0.1;
  root "/absolute/path/to/ontology-workbench-app/apps/web/dist-multiuser";
  index index.html;
  client_max_body_size 50m;
  add_header Content-Security-Policy "frame-ancestors 'self' https://app.workbench.aos.work" always;
  location = / { return 302 /ontology-management/; }
  location = /ontology-management { return 302 /ontology-management/; }
  location /api/v1/ {
   proxy_pass http://127.0.0.1:13002;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_read_timeout 30s;
  }
  location = /oidc/callback {
   access_log off;
   proxy_pass http://127.0.0.1:13002/api/v1/oidc/callback;
   proxy_set_header Host $host;
  }
  location ~* ^/ontology-management/.*\.(js|css|png|jpg|svg|ico|woff2?|ttf)$ {
   rewrite ^/ontology-management/(.*)$ /$1 break;
   try_files $uri =404;
  }
  location /ontology-management/ {
   rewrite ^/ontology-management/(.*)$ /$1 break;
   try_files $uri $uri/ /index.html;
  }
  location = /index.html { internal; }
  location / { return 404; }
 }
}
