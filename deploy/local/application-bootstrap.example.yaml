# 仅供显式执行本地受控初始化命令；复制到仓库外私有目录并填写隔离数据库连接。
spring:
  main:
    web-application-type: none
  datasource:
    url: ${ONTOLOGY_DB_URL}
    username: ${ONTOLOGY_BOOTSTRAP_DB_USER}
    password: ${ONTOLOGY_BOOTSTRAP_DB_PASSWORD}
  flyway:
    enabled: false
ontology:
  bootstrap:
    # 安全默认值；只有受控命令显式传 true 才会创建本地测试账号。
    apply: false
    file: ${ONTOLOGY_BOOTSTRAP_FILE:}
