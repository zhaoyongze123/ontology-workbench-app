worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  include /tmp/trusted-proxies.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_max_body_size 100m;
  server_tokens off;
  # Nginx 本身接收外部 HTTPS 网关的请求，转发时固定公共 origin，覆盖访客自带的代理头。
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "frame-ancestors 'self' https://app.workbench.aos.work" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /.well-known/oauth-authorization-server/api/v1 {
      proxy_pass http://api:13001/api/v1/.well-known/oauth-authorization-server;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
    location /api/v1/ {
      proxy_pass http://api:13001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 120s;
    }
    location = /oidc/callback {
      proxy_pass http://api:13001/api/v1/oidc/callback;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
    }
    location = / { return 302 /ontology-management/; }
    location = /ontology-management { return 302 /ontology-management/; }
    location ~* ^/ontology-management/.*\.(?:js|css|map|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
      rewrite ^/ontology-management/(.*)$ /$1 break;
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location /ontology-management/ {
      rewrite ^/ontology-management/(.*)$ /$1 break;
      try_files $uri $uri/ /index.html;
    }
    location / { return 404; }
  }
}
