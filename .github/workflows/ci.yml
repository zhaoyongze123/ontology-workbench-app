name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check_repository.py
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s integrations/workbench/tests -v

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -f apps/server/pom.xml verify

  database-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build isolated PostgreSQL/AGE image and run database integration tests
        run: bash apps/server/ontology-it/run.sh

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
        env:
          HUSKY: '0'
      - run: npm run test:errors
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          MULTIUSER_BUILD: '1'
      - run: npm run typecheck
        working-directory: apps/web
      - name: Install isolated Playwright smoke runner
        run: npm install --prefix "$RUNNER_TEMP/ontology-web-smoke" --no-package-lock --ignore-scripts playwright@1.60.0
      - name: Install Chromium for frontend contract smoke
        run: |
          "$RUNNER_TEMP/ontology-web-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run frontend contract smoke against mocked API
        run: node scripts/frontend_contract_smoke.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ontology-web-smoke/node_modules/playwright

