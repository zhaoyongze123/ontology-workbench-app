services:
  postgres:
    # 固定版本的源码构建镜像；容器仍使用独立临时数据盘。
    image: ${ONTOLOGY_IT_IMAGE:-ontology-postgres-age-it:16}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      POSTGRES_DB: ontology_multiuser_dev_20261020
      POSTGRES_USER: ontology_it_admin
      POSTGRES_PASSWORD: ${ONTOLOGY_IT_ADMIN_PASSWORD:?请通过 run.sh 启动隔离测试数据库}
    ports:
      - "127.0.0.1:${ONTOLOGY_IT_POSTGRES_PORT:-25433}:5432"
    # 测试数据只存在于容器临时层，容器销毁后不会残留业务数据。
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    volumes:
      - ./init/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
