services:
  postgres:
    # 复用已安装的 AGE 镜像，但启动独立容器、端口和临时数据盘。
    image: ontology-postgres-age-local:16
    pull_policy: never
    command: ["postgres", "-c", "shared_preload_libraries=age"]
    environment:
      POSTGRES_DB: ontology_multiuser_dev_20261020
      POSTGRES_USER: ontology_it_admin
      POSTGRES_PASSWORD: ${ONTOLOGY_IT_ADMIN_PASSWORD:?请通过 run.sh 启动隔离测试数据库}
      ONTOLOGY_IT_RUNTIME_PASSWORD: ${ONTOLOGY_IT_RUNTIME_PASSWORD:?请通过 run.sh 启动隔离测试数据库}
    ports:
      - "127.0.0.1:${ONTOLOGY_IT_POSTGRES_PORT:-25433}:5432"
    # 测试数据只存在于容器临时层，容器销毁后不会残留业务数据。
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    volumes:
      - ./init/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      - ./init/01-bootstrap.sh:/docker-entrypoint-initdb.d/01-bootstrap.sh:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.1__init_database.sql:/docker-entrypoint-initdb.d/10-V0.0.1__init_database.sql:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.2__identity_foundation.sql:/docker-entrypoint-initdb.d/20-V0.0.2__identity_foundation.sql:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.3__login_throttling.sql:/docker-entrypoint-initdb.d/30-V0.0.3__login_throttling.sql:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.4__project_invitations.sql:/docker-entrypoint-initdb.d/40-V0.0.4__project_invitations.sql:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.5__app_oauth_and_account_lifecycle.sql:/docker-entrypoint-initdb.d/50-V0.0.5__app_oauth_and_account_lifecycle.sql:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.6__oauth_consent_state.sql:/docker-entrypoint-initdb.d/60-V0.0.6__oauth_consent_state.sql:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.7__audit_protection.sql:/docker-entrypoint-initdb.d/70-V0.0.7__audit_protection.sql:ro
      - ../ontology-core/src/main/resources/flyway/V0.0.8__oauth_protocol_rate_limits.sql:/docker-entrypoint-initdb.d/80-V0.0.8__oauth_protocol_rate_limits.sql:ro
      - ./init/99-grant-runtime.sql:/docker-entrypoint-initdb.d/99-grant-runtime.sql:ro
